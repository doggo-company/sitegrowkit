# Agent CMS Kit — nginx (local development)
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Same request limit as PHP post_max_size; upload_max_filesize is 20M.
    # The remaining 5MiB allows multipart boundaries and image descriptions.
    client_max_body_size 25m;

    # 静的アセット（ビルド済み）は長期キャッシュ
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Inertia の preload Link ヘッダーが大きいため既定バッファでは 502 になる
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # 隠しファイル・機密ファイルへのアクセス拒否
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
}
