<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Leaf Design | Contact</title>
  <meta name="description" content="Green Leaf Design へのお問い合わせフォーム。制作のご相談・お見積もりはこちらからどうぞ。">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="Green Leaf Design" width="140" height="32"></a>
      <button class="nav-toggle" type="button" aria-controls="global-nav" aria-expanded="false">
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="visually-hidden">メニュー</span>
      </button>
      <nav class="gnav" id="global-nav" aria-label="グローバル">
        <ul>
          <li><a href="about.html">About</a></li>
          <li><a href="service.html">Service</a></li>
          <li><a href="works.html">Works</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-title">
      <div class="page-title-inner">
        <h1>Contact</h1>
        <p class="page-title-sub">お問い合わせ</p>
      </div>
    </section>

    <nav class="breadcrumb" aria-label="パンくず">
      <ol>
        <li><a href="index.html">Home</a></li>
        <li aria-current="page">Contact</li>
      </ol>
    </nav>

    <section class="section contact-body">
      <div class="section-inner">
        <p class="contact-lead">制作のご相談・お見積もりは下記フォームからお送りください。<br>
          お急ぎの場合は <a href="tel:075-000-0000">075-000-0000</a> までお電話ください。</p>
        <form class="contact-form" action="https://example.com/api/contact" method="post">
          <div class="field">
            <label for="name">お名前</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="field">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="field">
            <label for="type">ご用件</label>
            <select id="type" name="type">
              <option value="estimate">お見積もり</option>
              <option value="other">その他</option>
            </select>
          </div>
          <div class="field">
            <label for="message">内容</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>
          <div class="field field-checkbox">
            <label><input type="checkbox" name="privacy" required> <a href="about.html">プライバシーポリシー</a>に同意する</label>
          </div>
          <button type="submit" class="btn">送信</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer" id="site-footer">
    <div class="footer-inner">
      <div class="footer-about">
        <p class="footer-logo">Green Leaf Design</p>
        <p class="footer-address">京都市左京区0-0-0<br>
          <a href="tel:075-000-0000">075-000-0000</a> / <a href="mailto:hello@greenleaf.example">hello@greenleaf.example</a></p>
      </div>
      <ul class="footer-nav">
        <li><a href="about.html">About</a></li>
        <li><a href="service.html">Service</a></li>
        <li><a href="works.html">Works</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <p class="copyright">&copy; 2026 Green Leaf Design</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
